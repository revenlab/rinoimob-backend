spring:
  profiles:
    active: ${SPRING_PROFILE:dev}
  application:
    name: rinoimob-backend
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rinoimob}
    username: ${DB_USER:user}
    password: ${DB_PASSWORD:pass}
    driver-class-name: org.postgresql.Driver
  mail:
    host: ${MAIL_HOST:smtp.resend.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:resend}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.rinoimob: DEBUG
    
server:
  port: ${SERVER_PORT:39000}
  address: ${SERVER_ADDRESS:0.0.0.0}

jwt:
  secret: ${JWT_SECRET:rinoimob-dev-secret-key-change-in-production-must-be-at-least-512-bits-long!!}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:28800000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000,http://*.localhost:3000,http://*.localhost:5173,http://*.localhost:5174}
  public-cors:
    allowed-origins: ${PUBLIC_CORS_ALLOWED_ORIGINS:https://*}
  tenant-base-domain: ${TENANT_BASE_DOMAIN:}
  verification-token-expiration: ${VERIFICATION_TOKEN_EXPIRATION:86400}
  reset-token-expiration: ${RESET_TOKEN_EXPIRATION:3600}

billing:
  asaas:
    base-url: ${ASAAS_BASE_URL:https://api.asaas.com}
    api-key: ${ASAAS_API_KEY:}
    checkout-path: ${ASAAS_CHECKOUT_PATH:/v3/checkouts}
    checkout-callback-base-url: ${ASAAS_CHECKOUT_CALLBACK_BASE_URL:}
    checkout-expiration-minutes: ${ASAAS_CHECKOUT_EXPIRATION_MINUTES:60}
    billing-types: ${ASAAS_BILLING_TYPES:CREDIT_CARD}
    webhook-token: ${ASAAS_WEBHOOK_TOKEN:}
    past-due-scan-interval-ms: ${ASAAS_PAST_DUE_SCAN_INTERVAL_MS:3600000}
    webhook-processing-interval-ms: ${ASAAS_WEBHOOK_PROCESSING_INTERVAL_MS:2000}
    provider-operation-interval-ms: ${ASAAS_PROVIDER_OPERATION_INTERVAL_MS:30000}
    reconciliation-interval-ms: ${ASAAS_RECONCILIATION_INTERVAL_MS:900000}
    card-token-update-enabled: ${ASAAS_CARD_TOKEN_UPDATE_ENABLED:false}

audit:
  retention-days: ${AUDIT_RETENTION_DAYS:180}
  cleanup-interval-ms: ${AUDIT_RETENTION_CLEANUP_INTERVAL_MS:86400000}

seaweedfs:
  master:
    url: ${SEAWEEDFS_MASTER_URL:http://localhost:9333}
  volume:
    public-url: ${SEAWEEDFS_VOLUME_PUBLIC_URL:http://localhost:8080}

evolution:
  api:
    url: ${EVOLUTION_API_URL:http://localhost:8081}
    key: ${EVOLUTION_API_KEY:changeme-evolution-apikey}

cloudflare:
  api-token: ${CLOUDFLARE_API_TOKEN:}
  zone-id: ${CLOUDFLARE_ZONE_ID:}
  custom-hostname-target: ${CLOUDFLARE_CUSTOM_HOSTNAME_TARGET:}

# AI Language Model Configuration
ai:
  # Provider: gemini, mock
  provider: ${AI_PROVIDER:gemini}
  gemini:
    # API Key obtida em https://ai.google.dev/
    api-key: ${AI_GEMINI_API_KEY:}
    # Modelo Gemini a usar: gemini-2.5-flash (recomendado), gemini-2.5-pro
    # Ver: https://ai.google.dev/gemini-api/docs/models
    model: ${AI_GEMINI_MODEL:gemini-2.5-flash}
